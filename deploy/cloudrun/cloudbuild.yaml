# 이미지를 구글 서버에서 만든다 (이 PC 에 docker 가 없다).
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml
options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
substitutions:
  _IMAGE: asia-northeast3-docker.pkg.dev/${PROJECT_ID}/ai-company/app
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/cloudrun/Dockerfile", "-t", "${_IMAGE}:latest", "."]
images:
  - ${_IMAGE}:latest
timeout: 1800s
