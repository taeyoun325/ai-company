# 계정 DB 와 색인·지갑 DB 를 Cloud Storage 로 계속 복제한다 (DAY 27).
# 버킷 이름은 환경변수 STATE_BUCKET 에서 온다. 인증은 서비스 계정(ADC).
#
# ai_company.db 에는 프로젝트 색인과 **지갑**(wallet_store)이 함께 있다.
# 색인은 다시 만들 수 있지만 지갑은 아니다 — 그래서 이것도 복제한다.
dbs:
  - path: /app/data/ai_company_auth.db
    replicas:
      - url: gcs://${STATE_BUCKET}/litestream/auth
  - path: /app/data/ai_company.db
    replicas:
      - url: gcs://${STATE_BUCKET}/litestream/index
