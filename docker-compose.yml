# 개발용. 지금 필요한 것은 PostgreSQL 하나뿐이다.
#
# SQLite 로도 개발이 되므로(지시서 §5) 이 파일은 "PostgreSQL 로 옮겨도
# 되는지" 확인할 때 쓴다. 백엔드·프론트엔드는 아직 이미지로 굽지 않는다 —
# MVP가 굳기 전에 Dockerfile 을 유지하는 비용이 이득보다 크다.
#
#   docker compose up -d db
#   DATABASE_URL=postgresql://aicompany:aicompany@localhost:5432/aicompany python backend/run.py
#
# 주의: 이 개발 머신에는 docker 가 설치되어 있지 않다(DAY 1 확인).
# 이 파일은 아직 실행으로 검증되지 않았다.
#
# 서버에 올릴 때 (DAY 13 · docs/security.md):
#   DEPLOY_MODE=saas    로컬 접근 기능을 전부 막는다
#   SANDBOXED=1         생성된 코드를 실행하려면 필요. 다만 **먼저**
#                       네트워크 송신 제한과 자원 제한을 컨테이너에 걸 것.
#                       그 둘 없이 켜는 것은 거짓 서명이다
#   PROVIDER_MODE=real  키가 없으면 실패한다. auto 로 두면 조용히 Mock 이
#                       돌고 가짜 결과물이 진짜처럼 나간다

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aicompany
      POSTGRES_PASSWORD: aicompany
      POSTGRES_DB: aicompany
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicompany"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
