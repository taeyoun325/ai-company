<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 에이전트 컴퍼니</title>
<style>
/* ── 홀로그램 팔레트 ──────────────────────────────────────────── */
:root{
  --void:#04070f;  --deep:#070d1a;  --glass:rgba(18,32,54,.55);
  --line:rgba(94,205,255,.20); --line-hot:rgba(94,205,255,.55);
  --text:#d6ecff;  --dim:#93aac9;  --faint:#8ba3c4;
  --cy:#5ce6ff;  --pm:#6cc6ff;  --dev:#5cffb8;  --qa:#ffc36b;  --usr:#d6a3ff;
  --bad:#ff5f7e;
  --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--text); background:var(--void); overflow:hidden;
  font:14px/1.65 "Pretendard","Malgun Gothic",-apple-system,system-ui,sans-serif;
}
/* 배경: 성운 + 원근 격자 + 스캔라인 */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(63,224,255,.13), transparent 60%),
    radial-gradient(800px 600px at 92% 8%, rgba(201,139,255,.10), transparent 60%),
    radial-gradient(700px 500px at 50% 115%, rgba(77,255,176,.08), transparent 60%),
    linear-gradient(#04070f,#060b16);
}
body::after{
  content:""; position:fixed; inset:0; z-index:9; pointer-events:none; opacity:.35;
  background:repeating-linear-gradient(180deg,rgba(120,220,255,.045) 0 1px,transparent 1px 3px);
  animation:scan 8s linear infinite;
}
@keyframes scan{from{background-position-y:0}to{background-position-y:120px}}

.app{position:relative;z-index:1;display:grid;
     grid-template-columns:286px minmax(0,1fr) 300px;height:100vh;gap:12px;padding:12px}
@media(max-width:1200px){.app{grid-template-columns:250px minmax(0,1fr)}
  .rail-r{display:none}}
@media(max-width:820px){.app{grid-template-columns:1fr;height:auto;overflow:auto}
  body{overflow:auto} .rail-l{order:2}}

.skip{position:absolute;left:-9999px;top:0;z-index:40;padding:10px 16px;
      background:var(--deep);color:var(--cy);border:1px solid var(--cy);
      font:600 12px var(--mono);text-decoration:none}
.skip:focus{left:12px;top:12px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
ul.plain{list-style:none;margin:0;padding:0}
dl{margin:0}

/* ── 포커스 표시 ──────────────────────────────────────────────
   키보드 사용자가 지금 어디 있는지 항상 보이게 한다.
   :focus-visible 이라 마우스 클릭에는 링이 뜨지 않는다. */
:focus-visible{outline:2px solid var(--cy); outline-offset:2px}
.repo:focus-visible,.file:focus-visible{outline:2px solid var(--cy);outline-offset:-2px}

/* ── 모션 축소 ────────────────────────────────────────────────
   스캔라인이 8초마다 무한히 흐르고 맥박이 1.1초마다 뛴다.
   전정기관 장애가 있으면 이 화면을 못 쓴다. 전부 정지시킨다. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
  body::after{animation:none; opacity:.18}   /* 스캔라인은 정지 + 더 옅게 */
  .agent[data-on="1"] .orb{animation:none}
  .task.doing .mark{animation:none}
}

/* ── 패널 (코너 브래킷) ───────────────────────────────────────── */
.panel{position:relative;background:var(--glass);border:1px solid var(--line);
       backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.panel::before,.panel::after{content:"";position:absolute;width:13px;height:13px;
  border:1px solid var(--line-hot);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

.rail-l,.rail-r{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;
                scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sec{padding:13px 14px}
.sec h2{margin:0 0 11px;font:600 10px/1 var(--mono);letter-spacing:.22em;
        text-transform:uppercase;color:var(--cy);text-shadow:0 0 12px rgba(63,224,255,.5)}

/* ── 에이전트 홀로카드 ────────────────────────────────────────── */
.agent{position:relative;padding:11px 12px;border:1px solid var(--line);
       background:linear-gradient(180deg,rgba(63,224,255,.05),transparent);margin-bottom:9px}
.agent:last-child{margin-bottom:0}
.agent[data-on="1"]{border-color:var(--c);box-shadow:0 0 22px -6px var(--c),inset 0 0 22px -14px var(--c)}
.agent[data-on="1"] .orb{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--c)}50%{box-shadow:0 0 14px 3px var(--c)}}
.a-top{display:flex;align-items:center;gap:9px}
.orb{width:9px;height:9px;border-radius:99px;background:var(--c);flex:none}
.a-name{font-weight:650;font-size:13px;color:var(--c);letter-spacing:-.2px}
.a-model{margin-left:auto;font:10px var(--mono);color:var(--faint)}
.a-role{font-size:11px;color:var(--dim);margin:3px 0 8px}
.agent{margin-bottom:9px}
.bar{height:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--c);
       box-shadow:0 0 8px var(--c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.a-nums{display:flex;justify-content:space-between;gap:6px;margin:0;
        font:10.5px var(--mono);color:var(--dim)}
.a-nums>div{display:flex;gap:4px;min-width:0}
.a-nums dt{text-transform:uppercase}
.a-nums dd{margin:0;color:var(--text);font-weight:600}
.a-name{margin:0;font-size:13px}

/* ── 완성도 게이지 ────────────────────────────────────────────── */
.gauge{display:flex;align-items:center;gap:14px}
.gauge svg{flex:none;filter:drop-shadow(0 0 8px rgba(63,224,255,.55))}
.g-val{font:700 26px/1 var(--mono);fill:var(--text)}
.g-pct{font:600 10px/1 var(--mono);fill:var(--dim)}
.g-list{flex:1;min-width:0;font-size:11.5px;margin:0}
.g-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;
       padding:1.5px 0;color:var(--dim)}
.g-row>span,.g-row>dt{flex:none}
.g-row>dd{margin:0}
.g-row b,.g-row dd{margin-left:auto;color:var(--text);font:11.5px var(--mono);font-weight:600;
         text-align:right}

/* ── 채팅 ─────────────────────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar-top{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
.logo{font:700 13px/1 var(--mono);letter-spacing:.18em;color:var(--cy);
      text-shadow:0 0 14px rgba(63,224,255,.6)}
.tag{font:10px var(--mono);letter-spacing:.1em;padding:3px 8px;border:1px solid var(--line);
     color:var(--dim);text-transform:uppercase}
.tag.live{color:var(--dev);border-color:rgba(77,255,176,.4)}
.proj{margin-left:auto;font:11px var(--mono);color:var(--dim);overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap;max-width:44%}
.proj b{color:var(--cy)}

#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:13px;
     scrollbar-width:thin;scrollbar-color:var(--line) transparent}
@media(max-width:820px){#log{height:60vh}}

.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;max-width:820px;
     animation:mat .34s cubic-bezier(.2,.9,.25,1)}
@keyframes mat{from{opacity:0;transform:translateY(8px) scaleY(.96);filter:blur(2px)}
               to{opacity:1;transform:none;filter:none}}
.av{width:32px;height:32px;display:grid;place-items:center;font-size:15px;
    border:1px solid var(--c);color:var(--c);background:rgba(63,224,255,.06);
    box-shadow:0 0 14px -4px var(--c)}
.who{font:600 11px/1 var(--mono);letter-spacing:.09em;color:var(--c);
     margin:0 0 5px;text-transform:uppercase}
.bubble{position:relative;padding:9px 13px;background:rgba(20,36,60,.5);
        border:1px solid var(--line);border-left:2px solid var(--c);
        white-space:pre-wrap;word-break:break-word}
.msg.PM{--c:var(--pm)} .msg.DEV{--c:var(--dev)} .msg.QA{--c:var(--qa)}
.msg.USER{--c:var(--usr)} .msg.SYSTEM{--c:var(--dim)}
.msg.tool .bubble{background:transparent;border:1px dashed var(--line);border-left-width:2px;
                  color:var(--dim);font:12px var(--mono);padding:5px 11px}
.msg.tool .av{opacity:.45}
.msg.verdict .bubble{box-shadow:0 0 26px -12px var(--c),inset 0 0 30px -22px var(--c)}
.msg.error .bubble{border-color:var(--bad);border-left-color:var(--bad);color:var(--bad)}
code{font:12px var(--mono);background:rgba(63,224,255,.10);color:var(--cy);padding:1px 5px}
pre{margin:7px 0 0;padding:9px 11px;background:rgba(4,8,16,.75);border:1px solid var(--line);
    overflow-x:auto;font:11.5px/1.55 var(--mono);color:var(--dim)}

.div{display:flex;align-items:center;gap:11px;color:var(--cy);opacity:.75;
     font:10px var(--mono);letter-spacing:.24em;text-transform:uppercase;margin:5px 0}
.div>span:not(.vh){flex:none}
.div::before,.div::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-hot),transparent)}

form{display:flex;gap:9px;padding:12px 16px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;padding:10px 13px;border:1px solid var(--line);background:rgba(4,10,20,.7);
      color:var(--text);font:inherit}
input::placeholder{color:var(--faint)}
input:focus{outline:0;border-color:var(--cy);box-shadow:0 0 18px -6px var(--cy)}
button{padding:10px 20px;border:1px solid var(--cy);background:rgba(63,224,255,.11);
       color:var(--cy);font:600 12px/1.4 var(--mono);letter-spacing:.14em;cursor:pointer}
button:hover:not(:disabled){background:rgba(63,224,255,.22);box-shadow:0 0 20px -5px var(--cy)}
button:disabled{opacity:.35;cursor:not-allowed}

/* ── 태스크 · 저장소 ──────────────────────────────────────────── */
.task{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:6px 0;
      border-bottom:1px solid rgba(94,205,255,.10)}
.task:last-child{border-bottom:0}
.mark{flex:none;width:15px;font:11px var(--mono)}
.task.done{color:var(--faint)} .task.done .mark{color:var(--dev)}
.task.doing{color:var(--text)} .task.doing .mark{color:var(--cy);animation:blink 1s steps(2) infinite}
.task.todo{color:var(--dim)}
@keyframes blink{50%{opacity:.25}}

.repo{display:block;width:100%;text-align:left;padding:8px 9px;margin-bottom:6px;
      border:1px solid var(--line);background:rgba(63,224,255,.03);cursor:pointer;
      font:inherit;color:var(--text);letter-spacing:0}
.repo:hover{border-color:var(--line-hot);background:rgba(63,224,255,.09);box-shadow:none}
.repo[data-sel="1"]{border-color:var(--cy);box-shadow:0 0 18px -8px var(--cy)}
.r-top{display:flex;align-items:baseline;gap:7px}
.r-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-score{margin-left:auto;font:600 12px var(--mono)}
.r-meta{font:10px var(--mono);color:var(--faint);margin-top:3px}
.r-bar{height:2px;background:rgba(255,255,255,.07);margin-top:6px}
.r-bar i{display:block;height:100%;background:var(--cy);box-shadow:0 0 6px var(--cy)}

.file{display:block;width:100%;text-align:left;border:0;background:transparent;padding:3px 0;
      font:11.5px var(--mono);color:var(--dim);cursor:pointer;letter-spacing:0}
.file:hover{color:var(--cy);background:transparent;box-shadow:none}
.empty{font:11px var(--mono);color:var(--faint)}

/* ── 코드 뷰어 ────────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;
       background:rgba(2,5,11,.82);backdrop-filter:blur(4px)}
.modal[data-open="1"]{display:grid}
.viewer{width:min(880px,92vw);max-height:82vh;display:flex;flex-direction:column;
        background:var(--deep);border:1px solid var(--line-hot);box-shadow:0 0 60px -20px var(--cy)}
.v-top{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line)}
.v-path{font:12px var(--mono);color:var(--cy);margin:0;font-weight:400}
.v-x{margin-left:auto;padding:4px 11px;font-size:11px}
.v-body{overflow:auto;padding:14px 16px;margin:0;font:12px/1.65 var(--mono);color:var(--text);
        white-space:pre;background:transparent;border:0}
</style>
</head>
<body>
<a class="skip" href="#log">본문(대화 기록) 바로가기</a>
<div class="app">

  <!-- 좌측: 지금 무슨 일이 벌어지고 있나 -->
  <aside class="rail-l" aria-label="진행 상황 계기판">
    <section class="panel sec">
      <h2>Agents</h2>
      <div id="agents"></div>
    </section>

    <section class="panel sec">
      <h2>완성도</h2>
      <div class="gauge">
        <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true" focusable="false">
          <circle cx="52" cy="52" r="44" fill="none" stroke="rgba(94,205,255,.14)" stroke-width="7"/>
          <circle id="arc" cx="52" cy="52" r="44" fill="none" stroke="var(--cy)" stroke-width="7"
                  stroke-linecap="butt" stroke-dasharray="276.5" stroke-dashoffset="276.5"
                  transform="rotate(-90 52 52)" style="transition:stroke-dashoffset .7s ease,stroke .4s"/>
          <text id="gv" class="g-val" x="52" y="52" text-anchor="middle" dominant-baseline="central">0</text>
          <text class="g-pct" x="52" y="70" text-anchor="middle">PERCENT</text>
        </svg>
        <p class="vh" id="gv-text">완성도 0퍼센트</p>
        <dl class="g-list" id="gdetail">
          <div class="g-row"><dt>태스크</dt><dd>—</dd></div>
          <div class="g-row"><dt>테스트</dt><dd>—</dd></div>
          <div class="g-row"><dt>기준 커버</dt><dd>—</dd></div>
          <div class="g-row"><dt>재작업</dt><dd>—</dd></div>
          <div class="g-row"><dt>인수기준</dt><dd>—</dd></div>
        </dl>
      </div>
    </section>

    <section class="panel sec">
      <h2>합계</h2>
      <dl>
        <div class="g-row"><dt>입력 토큰</dt><dd id="t-in">0</dd></div>
        <div class="g-row"><dt>출력 토큰</dt><dd id="t-out">0</dd></div>
        <div class="g-row"><dt>API 호출</dt><dd id="t-calls">0</dd></div>
        <div class="g-row"><dt>누적 비용</dt><dd id="t-cost">$0.0000</dd></div>
        <div class="g-row"><dt>캐시 읽기</dt><dd id="t-cached">0</dd></div>
        <div class="g-row"><dt>검수 통과율</dt><dd id="t-qapass">—</dd></div>
        <div class="g-row"><dt>라운드</dt><dd id="t-round">0</dd></div>
      </dl>
    </section>
  </aside>

  <!-- 중앙: 대화 -->
  <main class="panel main">
    <header class="bar-top">
      <h1 class="logo">AI AGENT COMPANY</h1>
      <span class="tag" id="mode">연결 중</span>
      <p class="vh" id="phase-status" role="status">대기 중</p>
      <p class="proj" id="proj"></p>
    </header>
    <h2 class="vh">에이전트 대화 기록</h2>
    <div id="log" tabindex="-1" role="log" aria-live="polite"
     aria-relevant="additions" aria-label="에이전트 대화 기록"><div class="div">요구사항을 입력하면 회의가 시작됩니다</div></div>
    <form id="f">
      <h2 class="vh">요구사항 입력</h2>
      <label class="vh" for="q">만들고 싶은 프로그램을 설명하세요</label>
      <input id="q" autocomplete="off"
             placeholder="예: 사칙연산 계산기 모듈과 pytest 테스트를 만들어줘">
      <button id="go" type="submit">착수</button>
    </form>
  </main>

  <!-- 우측: 무엇이 만들어졌나 -->
  <aside class="rail-r" aria-label="산출물과 저장소">
    <section class="panel sec">
      <h2>태스크 보드</h2>
      <div id="board"><p class="empty">대기 중</p></div>
    </section>
    <section class="panel sec">
      <h2>산출물</h2>
      <div id="files"><p class="empty">(비어 있음)</p></div>
    </section>
    <section class="panel sec">
      <h2>저장소</h2>
      <div id="repos"><p class="empty">아직 없음</p></div>
    </section>
  </aside>
</div>

<div class="modal" id="modal">
  <div class="viewer" role="dialog" aria-modal="true" aria-labelledby="vpath">
    <div class="v-top"><h2 class="v-path" id="vpath">파일</h2>
      <button class="v-x" id="vx" type="button">닫기</button></div>
    <pre class="v-body" id="vbody" tabindex="0"></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log');

const ROLE = {
  PM:  {icon:'◈', name:'PM',      role:'기획 · 인수기준 · 최종검수', c:'var(--pm)'},
  DEV: {icon:'◆', name:'DEVELOPER',role:'구현 · 파일 쓰기 · 재작업',  c:'var(--dev)'},
  QA:  {icon:'◇', name:'VERIFIER', role:'교차검증 · 반려 판정',      c:'var(--qa)'},
};
const AV   = {PM:'◈', DEV:'◆', QA:'◇', SYSTEM:'⬡', USER:'▶'};
const NAME = {PM:'PM · CLAUDE', DEV:'DEV · CLAUDE', QA:'QA · GEMINI',
              SYSTEM:'SYSTEM', USER:'CLIENT'};
const PHASE = {PLAN:'기획', WRITE_TESTS:'테스트 선작성', IMPLEMENT:'구현',
               TEST:'테스트 실행', REVIEW:'검증', REPLAN:'재기획', FINALIZE:'최종검수'};
const ACTOR = {PLAN:'PM', REPLAN:'PM', FINALIZE:'PM', WRITE_TESTS:'QA',
               IMPLEMENT:'DEV', REVIEW:'QA', TEST:null};

let running = false, models = {}, curSlug = null;

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num = n => (n||0).toLocaleString('en-US');
function fmt(t){
  return esc(t)
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c)=>`<pre>${c.trim()}</pre>`)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
}

/* ── 에이전트 카드 ── */
function buildAgents(){
  $('agents').innerHTML = Object.entries(ROLE).map(([k,r])=>`
    <article class="agent" id="ag-${k}" data-on="0" style="--c:${r.c}"
             aria-labelledby="an-${k}">
      <div class="a-top"><span class="orb" aria-hidden="true"></span>
        <h3 class="a-name" id="an-${k}">
          <span aria-hidden="true">${r.icon}</span> ${r.name}</h3>
        <span class="a-model" id="am-${k}">—</span></div>
      <p class="a-role">${r.role}</p>
      <p class="vh" id="as-${k}">대기 중</p>
      <div class="bar" aria-hidden="true"><i id="ab-${k}"></i></div>
      <dl class="a-nums">
        <div><dt>입력</dt> <dd id="ai-${k}">0</dd></div>
        <div><dt>출력</dt> <dd id="ao-${k}">0</dd></div>
        <div><dt class="vh">비용</dt> <dd id="ac-${k}">$0.0000</dd></div>
      </dl>
    </article>`).join('');
}
buildAgents();

function renderUsage(u){
  const max = Math.max(1, ...Object.values(u).map(r => (r.input||0)+(r.output||0)));
  for (const k of ['PM','DEV','QA']){
    const r = u[k] || {input:0,output:0,cost:0};
    $('ai-'+k).textContent = num(r.input);
    $('ao-'+k).textContent = num(r.output);
    $('ac-'+k).textContent = '$' + (r.cost||0).toFixed(4);
    $('ab-'+k).style.width = (100*((r.input||0)+(r.output||0))/max) + '%';
    // 막대는 aria-hidden 이므로 카드 전체에 요약을 붙여 읽을 수 있게 한다
    const card = $('ag-'+k);
    if (card) card.title =
      `입력 ${num(r.input)} · 출력 ${num(r.output)} 토큰 · $${(r.cost||0).toFixed(4)}`;
  }
}
function setActive(agent){
  // 발광 테두리는 색이다. 색만으로는 전달되지 않으므로 숨김 텍스트를 함께 바꾼다.
  for (const k of ['PM','DEV','QA']){
    const on = (k === agent);
    $('ag-'+k).dataset.on = on ? '1' : '0';
    const st = $('as-'+k);
    if (st) st.textContent = on ? '작업 중' : '대기 중';
  }
}

/* ── 완성도 ── */
const C = 2*Math.PI*44;
function renderScore(v){
  $('arc').style.strokeDashoffset = C * (1 - (v||0)/100);
  $('arc').style.stroke = v >= 80 ? 'var(--dev)' : v >= 45 ? 'var(--cy)' : 'var(--qa)';
  $('gv').textContent = v||0;
  $('gv-text').textContent = `완성도 ${v||0}퍼센트`;   // SVG는 aria-hidden이라 텍스트로 제공
}
function renderDetail(d){
  $('gdetail').innerHTML = [
    ['태스크', d.tasks], ['테스트', d.tests], ['기준 커버', d.ac_coverage],
    ['재작업', d.reworks + '회'], ['재기획', d.replans + '회'],
    ['인수기준', d.criteria + (d.final ? ' ✔' : '')],
  ].map(([k,v])=>`<div class="g-row"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');
}

/* ── 채팅 ── */
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 140;
function addMsg(agent, text, kind){
  const stick = atBottom();
  const el = document.createElement('div');
  el.className = `msg ${agent} ${kind||'say'}`;
  // 툴 호출 로그는 부가 정보다. 매번 낭독되면 대화 자체를 못 따라간다.
  // 화면에는 남기되 라이브 낭독에서는 뺀다.
  const quiet = (kind === 'tool');
  const badge = {verdict:'판정', error:'오류'}[kind];
  if (quiet) el.setAttribute('aria-hidden', 'true');
  el.innerHTML =
    `<div class="av" aria-hidden="true">${AV[agent]||'•'}</div><div>
      <p class="who">${NAME[agent]||agent}${badge ? ` · ${badge}` : ''}</p>
      <div class="bubble">${fmt(text)}</div></div>`;
  log.appendChild(el);
  if (stick) log.scrollTop = log.scrollHeight;
}
function addDiv(text){
  const stick = atBottom();
  const el = document.createElement('p');
  el.className = 'div';
  el.innerHTML = `<span class="vh">단계 전환: </span>${esc(text)}`;
  log.appendChild(el);
  if (stick) log.scrollTop = log.scrollHeight;
}

/* ── 저장소 ── */
function renderRepos(list){
  const box = $('repos');
  if (!list.length){ box.innerHTML = '<p class="empty">아직 없음</p>'; return; }
  box.innerHTML = '<ul class="plain">' + list.map(p=>{
    const t = new Date((p.created_at||0)*1000);
    const stamp = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    const st = {running:'진행중', done:'완료', stopped:'중단'}[p.status] || p.status;
    return `<li><button class="repo" type="button" data-slug="${esc(p.slug)}"
      data-sel="${p.slug===curSlug?1:0}"
      aria-label="${esc(p.name||p.slug)} 프로젝트 열기, 완성도 ${p.score||0}점">
      <div class="r-top"><span class="r-name">${esc(p.name||p.slug)}</span>
        <span class="r-score">${p.score||0}</span></div>
      <div class="r-meta">${stamp} · ${st} · 파일 ${p.file_count||0} · $${(p.cost||0).toFixed(4)}</div>
      <div class="r-bar"><i style="width:${p.score||0}%"></i></div></button></li>`;
  }).join('') + '</ul>';
  box.querySelectorAll('.repo').forEach(b =>
    b.onclick = () => openProject(b.dataset.slug));
}
function loadRepos(){ fetch('/api/projects').then(r=>r.json()).then(d=>renderRepos(d.projects)); }

function openProject(slug){
  fetch('/api/projects/'+encodeURIComponent(slug)).then(r=>r.json()).then(p=>{
    curSlug = slug;
    renderFiles(p.files || [], slug);
    $('proj').innerHTML = `저장소 <b>${esc(p.name||slug)}</b> · 완성도 ${p.score||0}`;
    document.querySelectorAll('.repo').forEach(b =>
      b.dataset.sel = b.dataset.slug === slug ? '1' : '0');
  });
}
function renderFiles(files, slug){
  const box = $('files');
  if (!files.length){ box.innerHTML = '<p class="empty">(비어 있음)</p>'; return; }
  box.innerHTML = '<ul class="plain">' + files.map(f=>
    `<li><button class="file" data-f="${esc(f)}" type="button"
        aria-label="${esc(f)} 파일 내용 보기">▸ ${esc(f)}</button></li>`).join('') + '</ul>';
  box.querySelectorAll('.file').forEach(b =>
    b.onclick = () => viewFile(slug || curSlug, b.dataset.f));
}
function viewFile(slug, path){
  if (!slug) return;
  fetch(`/api/projects/${encodeURIComponent(slug)}/file?path=${encodeURIComponent(path)}`)
    .then(r=>r.json()).then(d=>{
      $('vpath').textContent = path;
      $('vbody').textContent = d.content ?? '(읽을 수 없음)';
      openModal();
    });
}
// 모달을 열기 전에 어디서 왔는지 기억해 뒀다가, 닫을 때 그 자리로 돌려보낸다.
let lastFocus = null;

function openModal(){
  lastFocus = document.activeElement;
  $('modal').dataset.open = '1';
  $('vx').focus();
}
function closeModal(){
  if ($('modal').dataset.open !== '1') return;
  $('modal').dataset.open = '0';
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  lastFocus = null;
}

$('vx').onclick = closeModal;
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };

addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); return; }
  // 포커스 트랩: 모달이 열린 동안 Tab이 뒤 페이지로 새지 않게 가둔다.
  if (e.key !== 'Tab' || $('modal').dataset.open !== '1') return;
  const items = $('modal').querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ── 이벤트 처리 ── */
function handle(ev){
  switch(ev.type){
    case 'message': addMsg(ev.agent, ev.text, ev.kind); break;
    case 'phase': {
      const label = PHASE[ev.name] || ev.name;
      addDiv(label + (ev.detail ? ' — ' + ev.detail : ''));
      $('phase-status').textContent = `현재 단계 ${label}`;
      setActive(ACTOR[ev.name]);
      break;
    }
    case 'state': {
      if (ev.usage)  renderUsage(ev.usage);
      if (ev.totals){
        $('t-in').textContent    = num(ev.totals.input);
        $('t-out').textContent   = num(ev.totals.output);
        $('t-calls').textContent = ev.totals.calls;
        $('t-cost').textContent  = '$' + ev.totals.cost.toFixed(4);
        const c = $('t-cached');
        c.textContent = num(ev.totals.cached);
        // 캐시가 실제로 걸리는지 표시한다. cache_control을 붙인 것과
        // 캐시가 적중한 것은 다르다 — 최소 길이 미만이면 조용히 무시된다.
        const bad = ev.cache_ok === false;
        c.style.color = bad ? 'var(--bad)' : '';
        // 색만으로 알리면 색각 이상인 사람은 놓친다. 표시를 덧붙인다.
        c.textContent = num(ev.totals.cached) + (bad ? ' ⚠ 미적중' : '');
        c.title = bad
          ? '캐시가 적중하지 않고 있습니다 (프리픽스가 최소 길이 미만일 수 있음)' : '';
      }
      if (ev.score_detail) $('t-qapass').textContent = ev.score_detail.review_pass_rate + '%';
      if (ev.score != null)   renderScore(ev.score);
      if (ev.score_detail)    renderDetail(ev.score_detail);
      if (ev.round != null)   $('t-round').textContent = ev.round;
      if (ev.tasks) $('board').innerHTML = '<ul class="plain">' + ev.tasks.map(t=>{
        const m = t.status==='done' ? '[✔]' : t.status==='doing' ? '[▶]' : '[ ]';
        const label = {done:'완료', doing:'진행 중', todo:'대기'}[t.status];
        return `<li class="task ${t.status}"><span class="mark" aria-hidden="true">${m}</span>
                <span><span class="vh">${label}: </span>${esc(t.title)}</span></li>`;
      }).join('') + '</ul>';
      if (ev.files) renderFiles(ev.files, curSlug);
      if (ev.project){
        curSlug = ev.project.slug;
        $('proj').innerHTML = `저장소 <b>${esc(ev.project.name)}</b>`;
        loadRepos();
      }
      break;
    }
    case 'projects': renderRepos(ev.list); break;
    case 'done': {
      setActive(null);
      addDiv(ev.ok ? `완료 — 완성도 ${ev.score}` : `종료 — 완성도 ${ev.score}`);
      addMsg('SYSTEM', ev.summary + (ev.unmet && ev.unmet.length
        ? '\n\n미충족 인수기준:\n' + ev.unmet.map(u=>'· '+u).join('\n') : ''),
        ev.ok ? 'say' : 'error');
      running = false; $('go').disabled = false;
      loadRepos();
      break;
    }
  }
}
new EventSource('/api/stream').onmessage = e => handle(JSON.parse(e.data));

fetch('/api/agents').then(r=>r.json()).then(d=>{
  models = d.models;
  const tag = $('mode');
  tag.textContent = d.mock ? 'MOCK' : 'LIVE';
  tag.className = 'tag' + (d.mock ? '' : ' live');
  tag.title = d.mock ? '대본 응답으로 도는 시연 모드입니다' : '실제 모델을 호출합니다';
  for (const k of ['PM','DEV','QA']) $('am-'+k).textContent = d.models[k];
});
loadRepos();

$('f').onsubmit = e => {
  e.preventDefault();
  const q = $('q');
  if (!q.value.trim() || running) return;
  running = true; $('go').disabled = true;
  log.innerHTML = '';
  renderScore(0);
  fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'},
                       body: JSON.stringify({requirement: q.value})});
  q.value = '';
};
</script>
</body>
